name: .NET Build

on:
  push:
    branches: [ main, feature/** ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '10.0.x'

    - name: Restore
      run: dotnet restore Calculator.sln

    - name: Build
      run: dotnet build Calculator.sln --configuration Release --no-restore

    - name: Run SimpleCalculatorFactory
      run: dotnet run --project SimpleCalculatorFactory --configuration Release --verbosity minimal
      continue-on-error: true

    - name: Run SimpleCalculator (smoke)
      run: dotnet run --project SimpleCalculator --configuration Release --verbosity minimal
      continue-on-error: true
